<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Studio Quest</title>
  <style>
    html, body { margin:0; height:100%; background:#0b0b0e; overflow:hidden; touch-action:none; }
    #wrap {
      position:fixed; inset:0; display:grid; place-items:center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; background:#111; border-radius:14px; box-shadow:0 10px 60px rgba(0,0,0,.5); }

    #prompt {
      position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
      background:rgba(10,10,12,.72); color:rgba(255,255,255,.92);
      border:1px solid rgba(255,255,255,.10); border-radius:16px;
      padding:10px 12px; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      font-size:14px; opacity:0; transition:opacity 120ms ease; pointer-events:none;
      max-width:min(620px, calc(100vw - 24px));
    }
    #prompt.show { opacity:1; }

    /* Touch controls */
    #touch { position:fixed; inset:0; pointer-events:none; }
    .touch-zone { position:absolute; pointer-events:auto; user-select:none; -webkit-user-select:none; }
    #dpad {
      left:14px; bottom:14px; width:168px; height:168px;
      background:rgba(10,10,12,.72); border:1px solid rgba(255,255,255,.10); border-radius:22px;
      display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
      gap:6px; padding:10px; box-sizing:border-box; touch-action:none;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    .dkey {
      border-radius:14px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.06);
      display:grid; place-items:center; color:rgba(255,255,255,.85); font-weight:700; font-size:16px;
    }
    .dkey:active,.dkey.active{ background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.25); }

    #buttons { right:14px; bottom:14px; display:grid; grid-auto-flow:column; gap:12px; align-items:end; touch-action:none;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    .btn {
      width:78px; height:78px; border-radius:999px; background:rgba(10,10,12,.72); border:1px solid rgba(255,255,255,.10);
      display:grid; place-items:center; font-weight:800; font-size:18px; letter-spacing:.5px;
      color:rgba(255,255,255,.92); box-shadow:0 8px 26px rgba(0,0,0,.35);
    }
    .btn:active,.btn.active{ transform:translateY(1px); background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.25); }

    /* Dialog */
    #dialog {
      position:fixed; inset:0; display:none; place-items:center;
      background:rgba(0,0,0,.55); padding:18px; box-sizing:border-box;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:rgba(255,255,255,.92);
    }
    #dialog.show { display:grid; }
    .card {
      width:min(540px,100%); background:rgba(18,18,22,.92); border:1px solid rgba(255,255,255,.14);
      border-radius:18px; padding:16px; box-shadow:0 18px 70px rgba(0,0,0,.5);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    }
    .card h3 { margin:0 0 8px 0; font-size:18px; }
    .card p { margin:0 0 14px 0; opacity:.92; line-height:1.35; }
    .row { display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
    .a {
      appearance:none; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.08);
      color:rgba(255,255,255,.95); padding:10px 14px; border-radius:12px; font-weight:700; cursor:pointer;
    }
    .a.primary{ background:rgba(120,170,255,.22); border-color:rgba(120,170,255,.35); }

    /* Fade overlay (transition) */
    #fade {
      position:fixed; inset:0; background:#000; opacity:0; pointer-events:none;
      transition: opacity 320ms ease;
    }
    #fade.show { opacity:1; }

    @media (pointer:fine){ #touch{ opacity:0.0; } }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
  </div>

  <div id="prompt">Appuie sur <b>E</b> / <b>A</b> pour interagir…</div>

  <div id="touch">
    <div id="dpad" class="touch-zone" aria-label="Direction">
      <div></div><div class="dkey" data-dir="up">▲</div><div></div>
      <div class="dkey" data-dir="left">◀</div><div></div><div class="dkey" data-dir="right">▶</div>
      <div></div><div class="dkey" data-dir="down">▼</div><div></div>
    </div>
    <div id="buttons" class="touch-zone" aria-label="Boutons">
      <div class="btn" id="btnB">B</div>
      <div class="btn" id="btnA">A</div>
    </div>
  </div>

  <div id="dialog" role="dialog" aria-modal="true">
    <div class="card">
      <h3>Matériel de musique</h3>
      <p>Tu veux faire des beats ?</p>
      <div class="row">
        <button class="a" id="noBtn">Non</button>
        <button class="a primary" id="yesBtn">Oui</button>
      </div>
      <p style="margin-top:10px; opacity:.8; font-size:13px">
        Astuce : sur mobile, le bouton <b>A</b> = interagir / valider.
      </p>
    </div>
  </div>

  <div id="fade"></div>

<script>
(() => {
  // =======================
  // CONFIG
  // =======================
  const MAP_IMAGE_URL = "studio-map.png";
  const REDIRECT_URL = "https://hokube.lu/synth2.html";

  // Vue écran rétro (caméra)
  const VIEW_W = 480;
  const VIEW_H = 270;

  // Taille sprite (plus grand = 4, énorme = 5)
  const SPRITE_SCALE = 4;

  // Bureau (d'après ton image annotée) pour map 1024x576
  // -> recalculé si map autre taille (scaling)
  const DESK_BASE = { x: 560, y: 20, w: 400, h: 230 };

  // Zone d'interaction (devant la chaise) pour map 1024x576
  const INTERACT_BASE = { x: 650, y: 180, w: 180, h: 140 };

  // Collisions bureau (plateau + enceintes) pour map 1024x576
  const COLLIDERS_BASE = [
    {x: 590, y: 90, w: 340, h: 70},  // plateau
    {x: 580, y: 50, w: 70, h: 70},   // enceinte G
    {x: 860, y: 50, w: 70, h: 70},   // enceinte D
  ];

  // =======================
  // CANVAS + CAMERA
  // =======================
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  const view = document.createElement("canvas");
  view.width = VIEW_W;
  view.height = VIEW_H;
  const vctx = view.getContext("2d");
  vctx.imageSmoothingEnabled = false;

  function fitToScreen() {
    const wrap = document.getElementById("wrap");
    const vw = wrap.clientWidth, vh = wrap.clientHeight;
    const scale = Math.floor(Math.min(vw / VIEW_W, vh / VIEW_H) * 1000) / 1000;
    canvas.width = VIEW_W;
    canvas.height = VIEW_H;
    canvas.style.width = Math.floor(VIEW_W * scale) + "px";
    canvas.style.height = Math.floor(VIEW_H * scale) + "px";
  }
  addEventListener("resize", fitToScreen, {passive:true});
  fitToScreen();

  // World size (set when map loaded)
  let WORLD_W = 1024;
  let WORLD_H = 576;

  // Scaled zones (set on load)
  let deskZone = {...DESK_BASE};
  let interactZone = {...INTERACT_BASE};
  let colliders = [];

  const cam = { x: 0, y: 0 };

  function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

  function updateCamera(player) {
    const targetX = (player.x + player.w/2) - VIEW_W/2;
    const targetY = (player.y + player.h/2) - VIEW_H/2;
    cam.x = clamp(targetX, 0, Math.max(0, WORLD_W - VIEW_W));
    cam.y = clamp(targetY, 0, Math.max(0, WORLD_H - VIEW_H));
  }

  // =======================
  // MAP
  // =======================
  const mapImg = new Image();
  mapImg.src = MAP_IMAGE_URL;

  function scaleRect(r, sx, sy) {
    return {
      x: Math.round(r.x * sx),
      y: Math.round(r.y * sy),
      w: Math.round(r.w * sx),
      h: Math.round(r.h * sy),
    };
  }

  function rebuildColliders() {
    // Border colliders + scaled desk colliders
    colliders = [
      {x: -200, y: -200, w: 200, h: WORLD_H + 400},
      {x: WORLD_W, y: -200, w: 200, h: WORLD_H + 400},
      {x: -200, y: -200, w: WORLD_W + 400, h: 200},
      {x: -200, y: WORLD_H, w: WORLD_W + 400, h: 200},

      // Bureau + enceintes (scaled)
      ...COLLIDERS_BASE.map(r => scaleRect(r, WORLD_W/1024, WORLD_H/576)),
    ];
  }

  // =======================
  // AUDIO (blip)
  // =======================
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = AC ? new AC() : null;
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
  }

  function blip() {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;

    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();

    o.type = "square";
    o.frequency.setValueAtTime(740, t0);
    o.frequency.exponentialRampToValueAtTime(520, t0 + 0.08);

    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.10, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.10);

    o.connect(g).connect(audioCtx.destination);
    o.start(t0);
    o.stop(t0 + 0.12);
  }

  // =======================
  // INPUT
  // =======================
  const keys = new Set();
  const input = { up:false, down:false, left:false, right:false, interact:false };

  addEventListener("keydown", (e) => {
    keys.add(e.code);
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space","Enter"].includes(e.code)) e.preventDefault();
    ensureAudio();
  }, {passive:false});
  addEventListener("keyup", (e) => keys.delete(e.code), {passive:true});

  function readKeyboard() {
    input.up = keys.has("ArrowUp") || keys.has("KeyW");
    input.down = keys.has("ArrowDown") || keys.has("KeyS");
    input.left = keys.has("ArrowLeft") || keys.has("KeyA");
    input.right = keys.has("ArrowRight") || keys.has("KeyD");
    input.interact = keys.has("KeyE") || keys.has("Enter");
  }

  const dkeys = [...document.querySelectorAll(".dkey")];
  const touchState = { up:false, down:false, left:false, right:false, a:false };

  function setDir(dir, pressed) {
    touchState[dir] = pressed;
    dkeys.forEach(k => { if (k.dataset.dir === dir) k.classList.toggle("active", pressed); });
  }
  dkeys.forEach(k => {
    const dir = k.dataset.dir;
    const start = (e)=>{ e.preventDefault(); ensureAudio(); setDir(dir,true); };
    const end = (e)=>{ e.preventDefault(); setDir(dir,false); };
    k.addEventListener("pointerdown", start);
    k.addEventListener("pointerup", end);
    k.addEventListener("pointercancel", end);
    k.addEventListener("pointerleave", end);
  });

  const btnA = document.getElementById("btnA");
  const btnB = document.getElementById("btnB");
  function bindButton(el, name) {
    const down=(e)=>{ e.preventDefault(); ensureAudio(); touchState[name]=true; el.classList.add("active"); };
    const up=(e)=>{ e.preventDefault(); touchState[name]=false; el.classList.remove("active"); };
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("pointerleave", up);
  }
  bindButton(btnA,"a");
  bindButton(btnB,"b");

  function mergeInputs() {
    input.up ||= touchState.up;
    input.down ||= touchState.down;
    input.left ||= touchState.left;
    input.right ||= touchState.right;
    input.interact ||= touchState.a; // A = interagir
  }

  function readGamepad() {
    const pads = navigator.getGamepads?.() || [];
    const gp = pads.find(p => p && p.connected);
    if (!gp) return;
    const axX = gp.axes?.[0] ?? 0;
    const axY = gp.axes?.[1] ?? 0;
    const dead = 0.25;

    input.left ||= (axX < -dead) || gp.buttons?.[14]?.pressed;
    input.right ||= (axX > dead) || gp.buttons?.[15]?.pressed;
    input.up ||= (axY < -dead) || gp.buttons?.[12]?.pressed;
    input.down ||= (axY > dead) || gp.buttons?.[13]?.pressed;

    // bouton A
    input.interact ||= !!gp.buttons?.[0]?.pressed;
  }

  // =======================
  // COLLISION
  // =======================
  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  // =======================
  // SPRITE SHEET (généré en code) - amélioré
  // 4 directions x 8 frames (marche) + idle breathing/blink
  // Layout: rows = down,left,right,up ; cols = 0..7
  // =======================
  const SPR_W = 20;
  const SPR_H = 28;

  const sheet = document.createElement("canvas");
  sheet.width = SPR_W * 8;
  sheet.height = SPR_H * 4;
  const sctx = sheet.getContext("2d");
  sctx.imageSmoothingEnabled = false;

  function px(x,y,w,h,c){ sctx.fillStyle=c; sctx.fillRect(x,y,w,h); }

  function drawSpriteFrame(row, col, phase) {
    const ox = col * SPR_W;
    const oy = row * SPR_H;
    sctx.clearRect(ox, oy, SPR_W, SPR_H);

    // Palette simple
    const outline = "#0f0f12";
    const skin = "#3b2a1f";
    const shirt = "#f2f2f2";
    const jean = "#2b4f9b";
    const shoe = "#0b0b0e";
    const hair = "#0b0b0e";
    const highlight = "rgba(255,255,255,0.18)";

    // phase 0..7 : marche fluide
    // pas = -1..+1..-1
    const stepCurve = [0, 1, 2, 1, 0, -1, -2, -1][phase];
    const legA = stepCurve;
    const legB = -stepCurve;

    // breathing (idle) : légère variation de torse
    const breath = (phase === 0) ? 0 : 0; // idle géré à part en runtime (scaling léger)
    void breath;

    // Base body position within frame
    const bx = ox + 6;
    const by = oy + 6;

    // shadow (dans le sprite)
    sctx.globalAlpha = 0.35;
    px(ox + 6, oy + 24, 8, 2, "#000");
    sctx.globalAlpha = 1;

    // head
    px(bx+1, by,   8, 8, outline);
    px(bx+2, by+1, 6, 6, skin);
    px(bx+2, by+1, 6, 1, hair);        // hairline
    px(bx+2, by+2, 1, 4, hair);
    px(bx+7, by+2, 1, 4, hair);
    px(bx+3, by+2, 4, 1, highlight);   // highlight

    // face by direction
    if (row === 0) { // down
      px(bx+3, by+4, 1, 1, "#000");
      px(bx+6, by+4, 1, 1, "#000");
    } else if (row === 1) { // left
      px(bx+3, by+4, 1, 1, "#000");
    } else if (row === 2) { // right
      px(bx+6, by+4, 1, 1, "#000");
    } else { // up
      // more hair, less face
      px(bx+2, by+3, 6, 2, hair);
    }

    // torso
    px(bx,   by+8, 10, 9, outline);
    px(bx+1, by+9, 8, 7, shirt);
    px(bx+2, by+9, 6, 1, highlight);

    // arms (swing with step)
    const armSwing = Math.round(stepCurve / 2);
    // left arm
    px(bx-2, by+9 + armSwing, 3, 6, outline);
    px(bx-1, by+10+ armSwing, 1, 4, skin);
    // right arm
    px(bx+10, by+9 - armSwing, 3, 6, outline);
    px(bx+11, by+10- armSwing, 1, 4, skin);

    // hips
    px(bx,   by+17, 10, 3, outline);
    px(bx+1, by+18, 8, 1, jean);

    // legs (walk)
    // left leg
    px(bx+1 + Math.sign(legA), by+19, 4, 4, outline);
    px(bx+2 + Math.sign(legA), by+20, 2, 2, jean);
    px(bx+2 + Math.sign(legA), by+22, 2, 1, shoe);

    // right leg
    px(bx+5 + Math.sign(legB), by+19, 4, 4, outline);
    px(bx+6 + Math.sign(legB), by+20, 2, 2, jean);
    px(bx+6 + Math.sign(legB), by+22, 2, 1, shoe);
  }

  // Build sheet frames for each direction
  for (let row=0; row<4; row++) {
    for (let col=0; col<8; col++) {
      drawSpriteFrame(row, col, col);
    }
  }

  // =======================
  // PLAYER
  // =======================
  const player = {
    x: 0, y: 0,
    w: 18, h: 18,     // hitbox
    speed: 190,       // world px/s
    facing: "down",
    moving: false,
    animTime: 0,
    frame: 0,         // 0..7
    idleTime: 0,
    blinkT: 0,
  };

  function moveWithCollision(dt) {
    let vx = 0, vy = 0;
    if (input.left) vx -= player.speed;
    if (input.right) vx += player.speed;
    if (input.up) vy -= player.speed;
    if (input.down) vy += player.speed;

    player.moving = (vx !== 0 || vy !== 0);

    if (vx && vy) { const inv = 1/Math.sqrt(2); vx*=inv; vy*=inv; }

    if (Math.abs(vx) > Math.abs(vy)) {
      if (vx > 0) player.facing = "right";
      if (vx < 0) player.facing = "left";
    } else if (vy) {
      if (vy > 0) player.facing = "down";
      if (vy < 0) player.facing = "up";
    }

    const nextX = { x: player.x + vx*dt, y: player.y, w: player.w, h: player.h };
    if (!colliders.some(c => rectsOverlap(nextX,c))) player.x = nextX.x;

    const nextY = { x: player.x, y: player.y + vy*dt, w: player.w, h: player.h };
    if (!colliders.some(c => rectsOverlap(nextY,c))) player.y = nextY.y;
  }

  function updateAnimation(dt) {
    if (player.moving) {
      player.animTime += dt;
      const fps = 12; // marche plus fluide
      player.frame = Math.floor(player.animTime * fps) % 8;
      player.idleTime = 0;
    } else {
      player.animTime = 0;
      player.frame = 0; // frame 0 = idle base
      player.idleTime += dt;
    }

    // blink timer (random-ish but deterministic)
    player.blinkT += dt;
    if (player.blinkT > 3.2 + (Math.sin(player.idleTime*0.7)*0.4)) {
      player.blinkT = 0;
      // on simule le blink en "cachant" yeux pendant 0.08s via runtime flag
      blinkActiveUntil = performance.now() + 80;
    }
  }

  // =======================
  // UI / INTERACTION + TRANSITION
  // =======================
  const prompt = document.getElementById("prompt");
  const dialog = document.getElementById("dialog");
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const fade = document.getElementById("fade");

  let near = false;
  let latch = false;
  let dialogOpen = false;
  let transitioning = false;
  let blinkActiveUntil = 0;

  function openDialog() {
    dialogOpen = true;
    dialog.classList.add("show");
    blip();
  }
  function closeDialog() {
    dialogOpen = false;
    dialog.classList.remove("show");
  }
  function transitionTo(url) {
    if (transitioning) return;
    transitioning = true;
    fade.classList.add("show");
    // petit délai pour laisser le fondu se faire
    setTimeout(() => { location.href = url; }, 360);
  }

  yesBtn.addEventListener("click", () => transitionTo(REDIRECT_URL));
  noBtn.addEventListener("click", closeDialog);

  addEventListener("keydown", (e) => {
    if (e.code === "Escape" && dialogOpen) { e.preventDefault(); closeDialog(); }
  }, {passive:false});

  function updateInteraction() {
    const p = { x: player.x, y: player.y, w: player.w, h: player.h };
    near = rectsOverlap(p, interactZone);

    prompt.classList.toggle("show", near && !dialogOpen && !transitioning);

    const wants = input.interact;
    if (wants && !latch) {
      latch = true;
      if (near && !dialogOpen && !transitioning) openDialog();
      else if (dialogOpen && !transitioning) transitionTo(REDIRECT_URL);
    }
    if (!wants) latch = false;
  }

  // =======================
  // RENDER
  // =======================
  function drawShadow(screenX, screenY) {
    // ombre dynamique : respire en idle, s’étire un peu en marche
    const t = performance.now() * 0.004;
    const breathe = player.moving ? 0.0 : (Math.sin(t) * 0.08);
    const stretch = player.moving ? 0.12 : 0.0;

    const w = (12 * SPRITE_SCALE) * (1 + stretch);
    const h = (3 * SPRITE_SCALE) * (1 - stretch + breathe);

    const x = Math.round(screenX + (SPR_W*SPRITE_SCALE)/2 - w/2);
    const y = Math.round(screenY + (SPR_H*SPRITE_SCALE) - (5*SPRITE_SCALE));

    vctx.globalAlpha = 0.28;
    vctx.fillStyle = "#000";
    vctx.fillRect(x, y, Math.round(w), Math.round(h));
    vctx.globalAlpha = 1;
  }

  function drawMusicIcon(screenX, screenY) {
    // petit "🎵" pixel-ish (sans emoji pour éviter rendu variable)
    const x = Math.round(screenX + (SPR_W*SPRITE_SCALE)/2);
    const y = Math.round(screenY - 10*SPRITE_SCALE + Math.sin(performance.now()*0.006)*2);

    // note: tige + rond
    vctx.globalAlpha = 0.95;
    vctx.fillStyle = "rgba(255,255,255,0.92)";
    // tige
    vctx.fillRect(x, y, 2, 10);
    // drapeau
    vctx.fillRect(x+2, y, 6, 2);
    vctx.fillRect(x+5, y+2, 3, 2);
    // rond
    vctx.fillRect(x-2, y+8, 6, 4);

    // contour simple
    vctx.globalAlpha = 1;
    vctx.fillStyle = "rgba(0,0,0,0.55)";
    vctx.fillRect(x-3, y+12, 8, 1);
  }

  function drawPlayer() {
    const row = (player.facing==="down")?0 : (player.facing==="left")?1 : (player.facing==="right")?2 : 3;
    const col = player.frame;

    const sx = col*SPR_W, sy = row*SPR_H;

    // monde -> vue
    // alignement : pieds au bas de la hitbox
    const screenX = Math.round((player.x - cam.x) - 6);
    const screenY = Math.round((player.y - cam.y) - 18);

    drawShadow(screenX, screenY);

    // breathing micro-scale en idle (torse qui respire)
    const t = performance.now() * 0.004;
    const breathe = player.moving ? 0 : (Math.sin(t) * 0.04);
    const scaleY = 1 + breathe;

    // draw with slight vertical scale (idle)
    const dw = SPR_W * SPRITE_SCALE;
    const dh = SPR_H * SPRITE_SCALE;

    vctx.save();
    vctx.translate(screenX, screenY + dh/2);
    vctx.scale(1, scaleY);
    vctx.translate(0, -dh/2);

    vctx.drawImage(sheet, sx, sy, SPR_W, SPR_H, 0, 0, dw, dh);

    // blink overlay (cache les yeux 80ms)
    if (performance.now() < blinkActiveUntil && (row === 0 || row === 1 || row === 2)) {
      // mask small eye area (approx)
      vctx.globalAlpha = 0.9;
      vctx.fillStyle = "#3b2a1f";
      // positions approximatives dans le sprite (scaled)
      const ex = 10 * SPRITE_SCALE;
      const ey = 10 * SPRITE_SCALE;
      vctx.fillRect(ex, ey, 8, 2);
      vctx.globalAlpha = 1;
    }

    vctx.restore();

    if (near && !dialogOpen && !transitioning) drawMusicIcon(screenX, screenY);
  }

  function render() {
    vctx.clearRect(0,0,VIEW_W,VIEW_H);

    // map visible portion
    if (mapImg.complete && mapImg.naturalWidth > 0) {
      vctx.drawImage(mapImg, cam.x, cam.y, VIEW_W, VIEW_H, 0, 0, VIEW_W, VIEW_H);
    } else {
      vctx.fillStyle="#222"; vctx.fillRect(0,0,VIEW_W,VIEW_H);
      vctx.globalAlpha = 0.08;
      for (let x=0; x<VIEW_W; x+=16) { vctx.fillStyle="#fff"; vctx.fillRect(x,0,1,VIEW_H); }
      for (let y=0; y<VIEW_H; y+=16) { vctx.fillStyle="#fff"; vctx.fillRect(0,y,VIEW_W,1); }
      vctx.globalAlpha = 1;
    }

    drawPlayer();

    ctx.clearRect(0,0,VIEW_W,VIEW_H);
    ctx.drawImage(view, 0, 0);
  }

  // =======================
  // INIT WORLD ON MAP LOAD
  // =======================
  mapImg.onload = () => {
    WORLD_W = mapImg.naturalWidth;
    WORLD_H = mapImg.naturalHeight;

    const sx = WORLD_W / 1024;
    const sy = WORLD_H / 576;

    deskZone = scaleRect(DESK_BASE, sx, sy);
    interactZone = scaleRect(INTERACT_BASE, sx, sy);

    rebuildColliders();

    // spawn au milieu bas de la grande zone tapis
    player.x = Math.round(WORLD_W * 0.45);
    player.y = Math.round(WORLD_H * 0.62);
  };

  mapImg.onerror = () => {
    // fallback si pas de map, mais jouable
    WORLD_W = 1024; WORLD_H = 576;
    const sx = 1, sy = 1;
    deskZone = scaleRect(DESK_BASE, sx, sy);
    interactZone = scaleRect(INTERACT_BASE, sx, sy);
    rebuildColliders();
    player.x = 460; player.y = 360;
  };

  // =======================
  // GAME LOOP
  // =======================
  let last = performance.now();
  function loop(t) {
    const dt = Math.min(0.033, (t-last)/1000);
    last = t;

    // reset each frame
    input.up=input.down=input.left=input.right=false;
    input.interact=false;

    readKeyboard();
    mergeInputs();
    readGamepad();

    if (!dialogOpen && !transitioning) moveWithCollision(dt);

    updateAnimation(dt);
    updateCamera(player);
    updateInteraction();
    render();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
