<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Studio Quest</title>

<style>
html, body { margin:0; height:100%; background:#0b0b0e; overflow:hidden; }
#wrap { position:fixed; inset:0; display:grid; place-items:center; }
canvas {
  image-rendering:pixelated;
  background:#111;
  border-radius:14px;
  box-shadow:0 10px 60px rgba(0,0,0,.5);
}
#prompt{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:rgba(0,0,0,.75);
  color:white;
  padding:10px 16px;
  border-radius:12px;
  font-family:sans-serif;
  font-size:14px;
  opacity:0;
  transition:.2s;
}
#prompt.show{ opacity:1; }

#dialog{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  background:rgba(0,0,0,.6);
  font-family:sans-serif;
}
#dialog.show{ display:grid; }

.card{
  background:#111;
  padding:20px;
  border-radius:14px;
  color:white;
  text-align:center;
}
button{
  margin:8px;
  padding:8px 14px;
  border-radius:8px;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>
<body>

<div id="wrap">
  <canvas id="game"></canvas>
</div>

<div id="prompt">Appuie sur E pour faire des beats 🎵</div>

<div id="dialog">
  <div class="card">
    <p>Tu veux faire des beats ?</p>
    <button onclick="location.href='https://hokube.lu/synth2.html'">Oui</button>
    <button onclick="closeDialog()">Non</button>
  </div>
</div>

<script>
(() => {

const MAP_URL = "studio-map2.png";
const SPR_URL = "player48.png";

const VIEW_W = 480;
const VIEW_H = 270;

const COLS = 3;
const ROWS = 4;

// Ton sprite 1024x1536
const FRAME_W = Math.floor(1024 / 3); // 341
const FRAME_H = Math.floor(1536 / 4); // 384

const TARGET_HEIGHT = 100; // taille visible du personnage

const deskZone = { x: 260, y: 30, w: 200, h: 100 };

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

canvas.width = VIEW_W;
canvas.height = VIEW_H;

const mapImg = new Image();
mapImg.src = MAP_URL;

const sprImg = new Image();
sprImg.src = SPR_URL;

const player = {
  x: 230,
  y: 160,
  w: 20,
  h: 20,
  speed: 140,
  facing: "down",
  moving:false,
  animCol:1,
  animTime:0
};

const keys = new Set();

addEventListener("keydown", e => keys.add(e.code));
addEventListener("keyup", e => keys.delete(e.code));

function overlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function move(dt){
  let vx=0, vy=0;

  if(keys.has("ArrowLeft")||keys.has("KeyA")) vx -= player.speed;
  if(keys.has("ArrowRight")||keys.has("KeyD")) vx += player.speed;
  if(keys.has("ArrowUp")||keys.has("KeyW")) vy -= player.speed;
  if(keys.has("ArrowDown")||keys.has("KeyS")) vy += player.speed;

  player.moving = vx!==0 || vy!==0;

  if(vx && vy){
    const inv = 1/Math.sqrt(2);
    vx*=inv; vy*=inv;
  }

  if(Math.abs(vx)>Math.abs(vy)){
    if(vx>0) player.facing="right";
    if(vx<0) player.facing="left";
  }else if(vy){
    if(vy>0) player.facing="down";
    if(vy<0) player.facing="up";
  }

  player.x += vx*dt;
  player.y += vy*dt;
}

function animate(dt){
  if(player.moving){
    player.animTime += dt;
    const phase = Math.floor(player.animTime*10)%4;
    player.animCol = [0,1,2,1][phase];
  }else{
    player.animCol = 1;
  }
}

function drawPlayer(){
  if(!sprImg.complete) return;

  const row =
    player.facing==="down" ? 0 :
    player.facing==="left" ? 1 :
    player.facing==="right" ? 2 : 3;

  const sx = player.animCol * FRAME_W;
  const sy = row * FRAME_H;

  const scale = TARGET_HEIGHT / FRAME_H;
  const drawW = FRAME_W * scale;
  const drawH = TARGET_HEIGHT;

  const dx = player.x - drawW/2 + player.w/2;
  const dy = player.y - drawH + player.h;

  ctx.drawImage(sprImg, sx, sy, FRAME_W, FRAME_H, dx, dy, drawW, drawH);
}

function render(){
  if(mapImg.complete){
    ctx.drawImage(mapImg, 0,0, VIEW_W, VIEW_H);
  }else{
    ctx.fillStyle="#222";
    ctx.fillRect(0,0,VIEW_W,VIEW_H);
  }
  drawPlayer();
}

function updateInteraction(){
  const interactZone = {
    x: deskZone.x-20,
    y: deskZone.y+deskZone.h-10,
    w: deskZone.w+40,
    h: 70
  };

  const near = overlap(player, interactZone);
  document.getElementById("prompt").classList.toggle("show", near);

  if(near && keys.has("KeyE")){
    openDialog();
  }
}

function openDialog(){
  document.getElementById("dialog").classList.add("show");
}
window.closeDialog = function(){
  document.getElementById("dialog").classList.remove("show");
}

let last=performance.now();
function loop(t){
  const dt=Math.min(0.033,(t-last)/1000);
  last=t;

  move(dt);
  animate(dt);
  updateInteraction();
  render();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
