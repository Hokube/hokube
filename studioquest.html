<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Studio Quest</title>
  <style>
    html, body { margin:0; height:100%; background:#0b0b0e; overflow:hidden; touch-action:none; }
    #wrap { position:fixed; inset:0; display:grid; place-items:center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; background:#111; border-radius:14px; box-shadow:0 10px 60px rgba(0,0,0,.5); }

    #prompt {
      position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
      background:rgba(10,10,12,.72); color:rgba(255,255,255,.92);
      border:1px solid rgba(255,255,255,.10); border-radius:16px;
      padding:10px 12px; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      font-size:14px; opacity:0; transition:opacity 120ms ease; pointer-events:none;
      max-width:min(620px, calc(100vw - 24px));
    }
    #prompt.show { opacity:1; }

    /* Touch controls */
    #touch { position:fixed; inset:0; pointer-events:none; }
    .touch-zone { position:absolute; pointer-events:auto; user-select:none; -webkit-user-select:none; }
    #dpad {
      left:14px; bottom:14px; width:168px; height:168px;
      background:rgba(10,10,12,.72); border:1px solid rgba(255,255,255,.10); border-radius:22px;
      display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
      gap:6px; padding:10px; box-sizing:border-box; touch-action:none;
    }
    .dkey {
      border-radius:14px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.06);
      display:grid; place-items:center; color:rgba(255,255,255,.85); font-weight:700; font-size:16px;
    }
    .dkey:active,.dkey.active{ background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.25); }

    #buttons { right:14px; bottom:14px; display:grid; grid-auto-flow:column; gap:12px; align-items:end; touch-action:none; }
    .btn {
      width:78px; height:78px; border-radius:999px; background:rgba(10,10,12,.72); border:1px solid rgba(255,255,255,.10);
      display:grid; place-items:center; font-weight:800; font-size:18px; letter-spacing:.5px;
      color:rgba(255,255,255,.92); box-shadow:0 8px 26px rgba(0,0,0,.35);
    }
    .btn:active,.btn.active{ transform:translateY(1px); background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.25); }

    /* Dialog */
    #dialog {
      position:fixed; inset:0; display:none; place-items:center;
      background:rgba(0,0,0,.55); padding:18px; box-sizing:border-box;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:rgba(255,255,255,.92);
    }
    #dialog.show { display:grid; }
    .card {
      width:min(540px,100%); background:rgba(18,18,22,.92); border:1px solid rgba(255,255,255,.14);
      border-radius:18px; padding:16px; box-shadow:0 18px 70px rgba(0,0,0,.5);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    }
    .card h3 { margin:0 0 8px 0; font-size:18px; }
    .card p { margin:0 0 14px 0; opacity:.92; line-height:1.35; }
    .row { display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
    .a {
      appearance:none; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.08);
      color:rgba(255,255,255,.95); padding:10px 14px; border-radius:12px; font-weight:700; cursor:pointer;
    }
    .a.primary{ background:rgba(120,170,255,.22); border-color:rgba(120,170,255,.35); }

    @media (pointer:fine){ #touch{ opacity:0.0; } }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="game"></canvas></div>
  <div id="prompt">Approche-toi du bureau pour interagir…</div>

  <div id="touch">
    <div id="dpad" class="touch-zone" aria-label="Direction">
      <div></div><div class="dkey" data-dir="up">▲</div><div></div>
      <div class="dkey" data-dir="left">◀</div><div></div><div class="dkey" data-dir="right">▶</div>
      <div></div><div class="dkey" data-dir="down">▼</div><div></div>
    </div>
    <div id="buttons" class="touch-zone" aria-label="Boutons">
      <div class="btn" id="btnB">B</div>
      <div class="btn" id="btnA">A</div>
    </div>
  </div>

  <div id="dialog" role="dialog" aria-modal="true">
    <div class="card">
      <h3>Matériel de musique</h3>
      <p>Tu veux faire des beats ?</p>
      <div class="row">
        <button class="a" id="noBtn">Non</button>
        <button class="a primary" id="yesBtn">Oui</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const MAP_IMAGE_URL = "studio-map.png";
  const PLAYER_SHEET_URL = "player.png";
  const REDIRECT_URL = "https://hokube.lu/synth2.html";

  // Vue "caméra"
  const VIEW_W = 480;
  const VIEW_H = 270;

  // Ton sprite sheet actuel est 1024x1536 et contient 3 colonnes x 4 lignes
  // => frameW = 1024/3 ≈ 341, frameH = 1536/4 = 384
  const SHEET_COLS = 3;
  const SHEET_ROWS = 4;
  const FRAME_W = 341;   // ok avec un pixel restant à droite, ça marche
  const FRAME_H = 384;

  // Taille affichée du perso (en pixels de la vue)
  // Si tu veux encore plus grand: augmente DRAW_H
  const DRAW_H = 96; // hauteur affichée
  const DRAW_SCALE = DRAW_H / FRAME_H;
  const DRAW_W = Math.round(FRAME_W * DRAW_SCALE);

  // Canvas
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  // Offscreen view buffer
  const view = document.createElement("canvas");
  view.width = VIEW_W; view.height = VIEW_H;
  const vctx = view.getContext("2d");
  vctx.imageSmoothingEnabled = false;

  function fitToScreen() {
    const wrap = document.getElementById("wrap");
    const vw = wrap.clientWidth, vh = wrap.clientHeight;
    const scale = Math.floor(Math.min(vw / VIEW_W, vh / VIEW_H) * 1000) / 1000;
    canvas.width = VIEW_W; canvas.height = VIEW_H;
    canvas.style.width = Math.floor(VIEW_W * scale) + "px";
    canvas.style.height = Math.floor(VIEW_H * scale) + "px";
  }
  addEventListener("resize", fitToScreen, {passive:true});
  fitToScreen();

  // Images
  const mapImg = new Image();
  mapImg.src = MAP_IMAGE_URL;

  const playerSheet = new Image();
  playerSheet.src = PLAYER_SHEET_URL;

  let WORLD_W = 1024, WORLD_H = 576;

  // Zone bureau (par défaut pour la map générée 1024x576)
  let deskZone = { x: 580, y: 40, w: 380, h: 170 };

  let colliders = [];
  function rebuildColliders() {
    colliders = [
      {x: -200, y: -200, w: 200, h: WORLD_H + 400},
      {x: WORLD_W, y: -200, w: 200, h: WORLD_H + 400},
      {x: -200, y: -200, w: WORLD_W + 400, h: 200},
      {x: -200, y: WORLD_H, w: WORLD_W + 400, h: 200},
      // bloque le bureau (optionnel)
      {x: deskZone.x, y: deskZone.y, w: deskZone.w, h: deskZone.h},
    ];
  }

  const player = {
    x: 500, y: 360,         // monde
    w: 22, h: 18,           // hitbox monde
    speed: 180,
    facing: "down",
    moving: false,
    animTime: 0,
    animCol: 1,             // 0..2
  };

  const cam = { x: 0, y: 0 };

  // Input
  const keys = new Set();
  const input = { up:false, down:false, left:false, right:false, interact:false };

  addEventListener("keydown", (e) => {
    keys.add(e.code);
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space","Enter"].includes(e.code)) e.preventDefault();
  }, {passive:false});
  addEventListener("keyup", (e) => keys.delete(e.code), {passive:true});

  function readKeyboard() {
    input.up = keys.has("ArrowUp") || keys.has("KeyW");
    input.down = keys.has("ArrowDown") || keys.has("KeyS");
    input.left = keys.has("ArrowLeft") || keys.has("KeyA");
    input.right = keys.has("ArrowRight") || keys.has("KeyD");
    input.interact = keys.has("KeyE") || keys.has("Enter");
  }

  // Touch
  const dkeys = [...document.querySelectorAll(".dkey")];
  const touchState = { up:false, down:false, left:false, right:false, a:false };
  function setDir(dir, pressed) {
    touchState[dir] = pressed;
    dkeys.forEach(k => { if (k.dataset.dir === dir) k.classList.toggle("active", pressed); });
  }
  dkeys.forEach(k => {
    const dir = k.dataset.dir;
    const start=(e)=>{ e.preventDefault(); setDir(dir,true); };
    const end=(e)=>{ e.preventDefault(); setDir(dir,false); };
    k.addEventListener("pointerdown", start);
    k.addEventListener("pointerup", end);
    k.addEventListener("pointercancel", end);
    k.addEventListener("pointerleave", end);
  });

  const btnA = document.getElementById("btnA");
  const btnB = document.getElementById("btnB");
  function bindButton(el, name) {
    const down=(e)=>{ e.preventDefault(); touchState[name]=true; el.classList.add("active"); };
    const up=(e)=>{ e.preventDefault(); touchState[name]=false; el.classList.remove("active"); };
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("pointerleave", up);
  }
  bindButton(btnA,"a");
  bindButton(btnB,"b");

  function mergeInputs() {
    input.up ||= touchState.up;
    input.down ||= touchState.down;
    input.left ||= touchState.left;
    input.right ||= touchState.right;
    input.interact ||= touchState.a; // A = interagir
  }

  function readGamepad() {
    const pads = navigator.getGamepads?.() || [];
    const gp = pads.find(p => p && p.connected);
    if (!gp) return;
    const axX = gp.axes?.[0] ?? 0;
    const axY = gp.axes?.[1] ?? 0;
    const dead = 0.25;

    input.left ||= (axX < -dead) || gp.buttons?.[14]?.pressed;
    input.right ||= (axX > dead) || gp.buttons?.[15]?.pressed;
    input.up ||= (axY < -dead) || gp.buttons?.[12]?.pressed;
    input.down ||= (axY > dead) || gp.buttons?.[13]?.pressed;

    input.interact ||= !!gp.buttons?.[0]?.pressed;
  }

  // Movement + collision
  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function moveWithCollision(dt) {
    let vx=0, vy=0;
    if (input.left) vx -= player.speed;
    if (input.right) vx += player.speed;
    if (input.up) vy -= player.speed;
    if (input.down) vy += player.speed;

    player.moving = (vx!==0 || vy!==0);

    if (vx && vy) { const inv=1/Math.sqrt(2); vx*=inv; vy*=inv; }

    if (Math.abs(vx) > Math.abs(vy)) {
      if (vx>0) player.facing="right";
      if (vx<0) player.facing="left";
    } else if (vy) {
      if (vy>0) player.facing="down";
      if (vy<0) player.facing="up";
    }

    const nx={x:player.x+vx*dt,y:player.y,w:player.w,h:player.h};
    if (!colliders.some(c=>rectsOverlap(nx,c))) player.x=nx.x;

    const ny={x:player.x,y:player.y+vy*dt,w:player.w,h:player.h};
    if (!colliders.some(c=>rectsOverlap(ny,c))) player.y=ny.y;
  }

  function updateAnimation(dt) {
    if (player.moving) {
      player.animTime += dt;
      const speed = 10;
      const phase = Math.floor(player.animTime * speed) % 4;
      player.animCol = [0,1,2,1][phase]; // 3 frames
    } else {
      player.animTime = 0;
      player.animCol = 1; // idle
    }
  }

  // Camera
  function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
  function updateCamera() {
    const tx = (player.x + player.w/2) - VIEW_W/2;
    const ty = (player.y + player.h/2) - VIEW_H/2;
    cam.x = clamp(tx, 0, Math.max(0, WORLD_W - VIEW_W));
    cam.y = clamp(ty, 0, Math.max(0, WORLD_H - VIEW_H));
  }

  // Interaction
  const prompt = document.getElementById("prompt");
  const dialog = document.getElementById("dialog");
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");

  let dialogOpen=false, latch=false;

  function updateInteraction() {
    const p={x:player.x,y:player.y,w:player.w,h:player.h};
    const interactZone={x:deskZone.x-24,y:deskZone.y+deskZone.h-10,w:deskZone.w+48,h:110};
    const near = rectsOverlap(p, interactZone);

    prompt.classList.toggle("show", near && !dialogOpen);

    const wants = input.interact;
    if (wants && !latch) {
      latch=true;
      if (near && !dialogOpen) { dialogOpen=true; dialog.classList.add("show"); }
      else if (dialogOpen) location.href = REDIRECT_URL;
    }
    if (!wants) latch=false;
  }

  yesBtn.addEventListener("click", ()=>location.href=REDIRECT_URL);
  noBtn.addEventListener("click", ()=>{ dialogOpen=false; dialog.classList.remove("show"); });
  addEventListener("keydown",(e)=>{
    if(e.code==="Escape" && dialogOpen){ e.preventDefault(); dialogOpen=false; dialog.classList.remove("show"); }
  },{passive:false});

  // Render
  function drawPlayer() {
    if (!(playerSheet.complete && playerSheet.naturalWidth>0)) return;

    // Mapping (vu ton sheet actuel) :
    // row 0 = face (down), row 1 = profil (right), row 2 = dos (up)
    // left = miroir du profil
    const row =
      (player.facing==="down") ? 0 :
      (player.facing==="up") ? 2 : 1;

    const col = player.animCol;

    const sx = col * FRAME_W;
    const sy = row * FRAME_H;

    // position monde -> vue
    // on aligne les "pieds" (bas du sprite) sur bas hitbox
    const dx = Math.round((player.x - cam.x) - (DRAW_W/2) + (player.w/2));
    const dy = Math.round((player.y - cam.y) - (DRAW_H) + (player.h));

    if (player.facing === "left") {
      // flip horizontal
      vctx.save();
      vctx.translate(dx + DRAW_W, dy);
      vctx.scale(-1, 1);
      vctx.drawImage(playerSheet, sx, sy, FRAME_W, FRAME_H, 0, 0, DRAW_W, DRAW_H);
      vctx.restore();
    } else {
      vctx.drawImage(playerSheet, sx, sy, FRAME_W, FRAME_H, dx, dy, DRAW_W, DRAW_H);
    }
  }

  function render() {
    vctx.clearRect(0,0,VIEW_W,VIEW_H);

    if (mapImg.complete && mapImg.naturalWidth>0) {
      vctx.drawImage(mapImg, cam.x, cam.y, VIEW_W, VIEW_H, 0, 0, VIEW_W, VIEW_H);
    } else {
      vctx.fillStyle="#222"; vctx.fillRect(0,0,VIEW_W,VIEW_H);
    }

    drawPlayer();

    ctx.clearRect(0,0,VIEW_W,VIEW_H);
    ctx.drawImage(view,0,0);
  }

  // Init when map is ready
  mapImg.onload = () => {
    WORLD_W = mapImg.naturalWidth;
    WORLD_H = mapImg.naturalHeight;

    // spawn
    player.x = Math.round(WORLD_W * 0.48);
    player.y = Math.round(WORLD_H * 0.62);

    // deskZone scale if map size differs
    const sx = WORLD_W / 1024;
    const sy = WORLD_H / 576;
    deskZone = {
      x: Math.round(580*sx),
      y: Math.round(40*sy),
      w: Math.round(380*sx),
      h: Math.round(170*sy),
    };

    rebuildColliders();
  };
  mapImg.onerror = () => { WORLD_W=1024; WORLD_H=576; rebuildColliders(); };

  // Loop
  let last=performance.now();
  function loop(t){
    const dt=Math.min(0.033,(t-last)/1000); last=t;

    input.up=input.down=input.left=input.right=false;
    input.interact=false;

    readKeyboard();
    mergeInputs();
    readGamepad();

    if(!dialogOpen) moveWithCollision(dt);
    updateAnimation(dt);
    updateCamera();
    updateInteraction();
    render();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
